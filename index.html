<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>🎮 Tetris Game</title>

    <link rel="stylesheet" href="style.css">

    <!-- QR Code Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>

<body>

    <div class="background"></div>

    <main class="home-container">

        <div class="game-card">

            <div class="logo">
                🎮
            </div>

            <h1>TETRIS</h1>

            <h2>MINI GAME</h2>

            <p class="scan-title">
                📱 SCAN TO PLAY
            </p>

            <div class="qr-wrapper">
                <div id="qrcode"></div>
            </div>

            <p class="scan-text">
                Scan the QR Code using your<br>
                Android or iPhone
            </p>

            <button class="play-button" onclick="openGame()">
                ▶ PLAY TETRIS
            </button>

        </div>

    </main>


    <script>

        /*
         * IMPORTANT:
         *
         * Kapag na-upload na ito sa GitHub Pages,
         * papalitan natin ang URL na ito ng actual
         * GitHub Pages URL ng Tetris game.
         *
         * Example:
         *
         * https://username.github.io/tetris-game/tetris.html
         */

        const gameURL =
            "https://YOURUSERNAME.github.io/tetris-game/tetris.html";


        // Generate QR Code
        new QRCode(document.getElementById("qrcode"), {
            text: gameURL,
            width: 240,
            height: 240,
            colorDark: "#000000",
            colorLight: "#ffffff",
            correctLevel: QRCode.CorrectLevel.H
        });


        // Play button
        function openGame() {
            window.location.href = "tetris.html";
        }

    </script>

</body>
</html>
