<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>🎮 Tetris Game</title>

    <link rel="stylesheet" href="style.css">

    <!-- QR Code Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>

<body>

    <div class="background"></div>

    <main class="home-container">

        <div class="game-card">

            <div class="logo">
                🎮
            </div>

            <h1>TETRIS</h1>

            <h2>MINI GAME</h2>

            <p class="scan-title">
                📱 SCAN TO PLAY
            </p>

            <div class="qr-wrapper">
                <div id="qrcode"></div>
            </div>

            <p class="scan-text">
                Scan the QR Code using your<br>
                Android or iPhone
            </p>

            <button class="play-button" onclick="openGame()">
                ▶ PLAY TETRIS
            </button>

        </div>

    </main>


   
<script>
    const gameURL = "https://srtg2k26-create.github.io/tetris-game/tetris.html";

    new QRCode(document.getElementById("qrcode"), {
        text: gameURL,
        width: 220,
        height: 220,
        colorDark: "#000000",
        colorLight: "#ffffff",
        correctLevel: QRCode.CorrectLevel.H
    });

    function playTetris() {
        window.location.href = gameURL;
    }
</script>

</body>
</html>
